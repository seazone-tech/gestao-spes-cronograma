body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

/* SUMMARY BAR */
.summary {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 8px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  font-size: 12px; color: var(--muted);
}
.summary strong { color: var(--text); font-variant-numeric: tabular-nums; }
.summary-pill {
  display: inline-flex; align-items: center; gap: 5px;

  font-size: 11px; font-weight: 600; letter-spacing: .03em;
}
.pill-age { background: rgba(217,119,6,.12);  color: var(--amber);  }
.pill-ago { background: rgba(12,154,138,.12); color: var(--teal);   }
.pill-std { background: rgba(124,58,237,.12); color: var(--purple); }
.edit-hint { font-size: 11px; color: var(--faint); margin-left: auto; }

table {

th {

th.c-crono  { width: 175px; }

tbody tr.row-old { background: rgba(220,38,38,.03); }
tbody tr.row-edited { box-shadow: inset 3px 0 0 var(--blue); }

td { padding: 10px 12px; vertical-align: top; font-size: 13px; }
td.c-num { text-align: center; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
td.c-emp { font-weight: 600; font-size: 13px; }
td.c-status, td.c-obs, td.c-nom { vertical-align: middle; }

/* EDITABLE CELLS */
[contenteditable] {

[contenteditable]:focus {

body:not(.edit-mode) [contenteditable] { pointer-events: none; cursor: default; }

.crono-drop {

.crono-icon { font-size: 18px; line-height: 1; }

  position: absolute; top: 3px; right: 3px;

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function classificaTipo(raw) {
  const r = raw.toLowerCase();
  if (r.includes('tira') || r.includes('sessão tira') || /\bstd\b/.test(r)) return 'STD';
  if (r.includes('extraordin') || /\bage\b/.test(r)) return 'AGE';
  if (r.includes('ordinár') || r.includes('ordinar') || /\bago\b/.test(r)) return 'AGO';
  return 'AGO';
}
function parseData(s) {
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (m) return new Date(+m[3],+m[2]-1,+m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1],+m[2]-1,+m[3]);
  m = s.match(/^(\d{2})\/(\d{4})$/);
  if (m) return new Date(+m[2],+m[1]-1,15);
  return null;
}
function isOld(s) {
  const d = parseData(s); if (!d) return false;
  const c = new Date(); c.setMonth(c.getMonth()-6); return d < c;
}
function fmtDate(s) {
  const d = parseData(s); if (!d) return s;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── STORAGE ─────────────────────────────────────────────────────────────────

function load(k,d) { try { return localStorage.getItem('pmo_reu_'+k)??d; } catch(e){ return d; } }

function buildRow(d, i) {
  const [emp, meeting, dataStr, link] = d;
  const baseTipo = classificaTipo(meeting);
  const old      = isOld(dataStr);
  const dataFmt  = fmtDate(dataStr);
  const key      = emp.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');

  const savedEmp  = load(key+'_emp',  '');
  const savedMtg  = load(key+'_mtg',  '');
  const savedTipo = load(key+'_tipo', '');
  const savedData = load(key+'_data', '');
  const savedLnk  = load(key+'_lnk',  '');
  const savedImg  = load(key+'_img',  '');
  const savedText = load(key+'_txt',  '');
  const savedSt   = load(key+'_st',   '');
  const savedObs  = load(key+'_obs',  '');
  const savedNom  = load(key+'_nom',  '');

  const empDisp  = savedEmp  || emp;
  const mtgDisp  = savedMtg  || meeting;
  const tipoDisp = savedTipo || baseTipo;
  const dataDisp = savedData || dataFmt;
  const linkDisp = savedLnk  || link;

  const tc = tipoDisp==='AGE'?'b-age':tipoDisp==='STD'?'b-std':'b-ago';
  const isEdited = !!(savedEmp||savedMtg||savedTipo||savedData||savedLnk);

  const okA  = v => v==='ok'  ? ' active' : '';
  const nokA = v => v==='nok' ? ' active' : '';

  // Drive link block
  const driveBlock = `
    <div class="drive-wrap">
      ${linkDisp
        ? `<a class="folder-link" id="dlink-${i}" href="${escHtml(linkDisp)}" target="_blank" rel="noopener">📂 Drive ↗</a>`
        : `<span class="folder-link" id="dlink-${i}" style="opacity:.4;pointer-events:none">📂 Drive</span>`}
      <div class="drive-url-edit" id="durl-${i}" contenteditable="true"
        data-orig="${escHtml(link)}"
        onblur="saveDriveLink(${i},'${key}',this)"
        onfocus="markEdited(${i})"
        title="Cole ou edite o link do Drive">${escHtml(linkDisp)}</div>
    </div>`;

  return `
  <tr class="${old?'row-old':''} ${isEdited?'row-edited':''}" id="tr-${i}">
    <td class="c-num">${i+1}</td>
    <td class="c-emp">
      <div class="emp-actions">
        <span class="edited-dot" title="Linha editada"></span>
        <button class="btn-reset" onclick="resetRow(${i},'${key}')" title="Restaurar original">↺ Restaurar</button>
      </div>
      <span class="emp-name" id="ename-${i}" contenteditable="true"
        onblur="saveField(${i},'${key}','emp',this)"
        onfocus="markEdited(${i})">${escHtml(empDisp)}</span>
      <span class="mtg-name" id="mname-${i}" contenteditable="true"
        onblur="saveField(${i},'${key}','mtg',this)"
        onfocus="markEdited(${i})">${escHtml(mtgDisp)}</span>
      ${driveBlock}
    </td>
    <td>
      <span class="badge ${tc}" id="badge-${i}"
        onclick="cycleTipo(${i},'${key}')">${tipoDisp}</span>
    </td>
    <td class="c-data ${old?'data-old':''}">
      <span id="data-${i}" contenteditable="true"
        onblur="saveField(${i},'${key}','data',this)"
        onfocus="markEdited(${i})">${escHtml(dataDisp)}</span>
    </td>
    <td class="c-crono crono-cell">
      <div class="crono-drop" id="cd-${i}" title="Clique para upload ou cole Ctrl+V">
        <button class="crono-del" onclick="clearImg(${i},'${key}');event.stopPropagation()">✕</button>
        <input type="file" accept="image/*" onchange="handleFile(event,${i},'${key}')">
        ${savedImg
          ? `<img src="${savedImg}" alt="Cronograma" id="ci-${i}">`
          : `<span class="crono-icon">📷</span><span>Cronograma</span><span style="font-size:10px;opacity:.7">clique ou cole</span>`}
      </div>
    </td>
    <td>
      <textarea class="analise-ta" rows="3" placeholder="Observações PMO..."
        oninput="save('${key}_txt',this.value)"
        id="ta-${i}">${savedText}</textarea>
    </td>
    <td class="c-status">
      <div class="status-group">
        <button class="st-btn st-ok${okA(savedSt)}"   title="OK"     onclick="setSt(${i},'${key}','st','ok')"   id="ok-${i}">✓</button>
        <button class="st-btn st-nok${nokA(savedSt)}" title="Não OK" onclick="setSt(${i},'${key}','st','nok')"  id="nok-${i}">✕</button>
      </div>
    </td>
    <td class="c-obs">
      <div class="status-group">
        <button class="st-btn st-ok${okA(savedObs)}"   title="OK"     onclick="setSt(${i},'${key}','obs','ok')"   id="obs-ok-${i}">✓</button>
        <button class="st-btn st-nok${nokA(savedObs)}" title="Não OK" onclick="setSt(${i},'${key}','obs','nok')"  id="obs-nok-${i}">✕</button>
      </div>
    </td>
    <td class="c-nom">
      <div class="status-group">
        <button class="st-btn st-ok${okA(savedNom)}"   title="OK"     onclick="setSt(${i},'${key}','nom','ok')"   id="nom-ok-${i}">✓</button>
        <button class="st-btn st-nok${nokA(savedNom)}" title="Não OK" onclick="setSt(${i},'${key}','nom','nok')"  id="nom-nok-${i}">✕</button>
      </div>
    </td>
  </tr>`;
}

// ─── EDIT MODE TOGGLE ─────────────────────────────────────────────────────────
let editMode = false;
function toggleEdit() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  const btn = document.getElementById('btn-edit');
  btn.classList.toggle('edit-on', editMode);
  btn.textContent = editMode ? '✅ Editando...' : '✏️ Editar linhas';
  document.getElementById('edit-hint').textContent = editMode
    ? 'Nome · Reunião · Tipo (badge) · Data · Link Drive — todos editáveis'
    : 'Clique em "Editar linhas" para modificar qualquer campo';
}

// ─── FIELD EDIT ───────────────────────────────────────────────────────────────
function saveField(i, key, field, el) {
  const val = el.textContent.trim();
  const [emp, meeting, dataStr] = DATA[i];
  const orig = field==='emp'?emp : field==='mtg'?meeting : field==='data'?fmtDate(dataStr) : '';
  save(key+'_'+field, val===orig ? '' : val);
  checkEditedState(i, key);
}
function saveDriveLink(i, key, el) {
  const val = el.textContent.trim();
  const orig = DATA[i][3];
  save(key+'_lnk', val===orig ? '' : val);
  // Update the anchor href live
  const anchor = document.getElementById('dlink-'+i);
  if (anchor) {
    if (val) {
      anchor.href = val;
      anchor.style.opacity = '';
      anchor.style.pointerEvents = '';
    } else {
      anchor.removeAttribute('href');
      anchor.style.opacity = '.4';
      anchor.style.pointerEvents = 'none';
    }
  }
  checkEditedState(i, key);
}
function markEdited(i) { document.getElementById('tr-'+i).classList.add('row-edited'); }
function checkEditedState(i, key) {
  const hasEdit = ['emp','mtg','tipo','data','lnk'].some(f => load(key+'_'+f,'') !== '');
  document.getElementById('tr-'+i).classList.toggle('row-edited', hasEdit);
}

// ─── TIPO CYCLE ───────────────────────────────────────────────────────────────
function cycleTipo(i, key) {
  if (!editMode) return;
  const tipos = ['AGE','AGO','STD'];
  const badge = document.getElementById('badge-'+i);
  const cur = badge.textContent.trim().replace(' ↻','');
  const next = tipos[(tipos.indexOf(cur)+1)%tipos.length];
  badge.textContent = next;
  badge.className = 'badge '+(next==='AGE'?'b-age':next==='STD'?'b-std':'b-ago');
  const origTipo = classificaTipo(DATA[i][1]);
  save(key+'_tipo', next===origTipo ? '' : next);
  checkEditedState(i, key);
  updateSummary();
}

// ─── RESET ROW ────────────────────────────────────────────────────────────────
function resetRow(i, key) {
  ['emp','mtg','tipo','data','lnk'].forEach(f => save(key+'_'+f,''));
  const [emp, meeting, dataStr, link] = DATA[i];
  const tipo = classificaTipo(meeting);
  const dataFmt = fmtDate(dataStr);
  document.getElementById('ename-'+i).textContent = emp;
  document.getElementById('mname-'+i).textContent = meeting;
  document.getElementById('durl-'+i).textContent = link;
  const anchor = document.getElementById('dlink-'+i);
  if (anchor && link) { anchor.href = link; anchor.style.opacity=''; anchor.style.pointerEvents=''; }
  const badge = document.getElementById('badge-'+i);
  badge.textContent = tipo;
  badge.className = 'badge '+(tipo==='AGE'?'b-age':tipo==='STD'?'b-std':'b-ago');
  document.getElementById('data-'+i).textContent = dataFmt;
  document.getElementById('tr-'+i).classList.remove('row-edited');
  updateSummary();
}

// ─── IMAGE HANDLING ───────────────────────────────────────────────────────────
function handleFile(e, i, key) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => setImg(i, key, ev.target.result);
  r.readAsDataURL(f);
}
function setImg(i, key, src) {
  save(key+'_img', src);
  document.getElementById('cd-'+i).innerHTML =
    `<button class="crono-del" onclick="clearImg(${i},'${key}');event.stopPropagation()">✕</button>
    <input type="file" accept="image/*" onchange="handleFile(event,${i},'${key}')">
    <img src="${src}" alt="Cronograma" id="ci-${i}">`;
}
function clearImg(i, key) {
  save(key+'_img','');
  document.getElementById('cd-'+i).innerHTML =
    `<button class="crono-del" onclick="clearImg(${i},'${key}');event.stopPropagation()">✕</button>
    <input type="file" accept="image/*" onchange="handleFile(event,${i},'${key}')">
    <span class="crono-icon">📷</span><span>Cronograma</span><span style="font-size:10px;opacity:.7">clique ou cole</span>`;
}

// ─── STATUS TOGGLE (generic — suffix = 'st', 'obs', 'nom') ───────────────────
function setSt(i, key, sfx, val) {
  const cur = load(key+'_'+sfx, '');
  const next = cur===val ? '' : val;
  save(key+'_'+sfx, next);
  const prefix = sfx==='st' ? '' : sfx+'-';
  document.getElementById(prefix+'ok-'+i).className  = 'st-btn st-ok'  + (next==='ok'  ? ' active' : '');
  document.getElementById(prefix+'nok-'+i).className = 'st-btn st-nok' + (next==='nok' ? ' active' : '');
}

// ─── SUMMARY ─────────────────────────────────────────────────────────────────
function updateSummary() {
  let age=0,ago=0,std=0;
  document.querySelectorAll('#tbody .badge').forEach(b => {
    const t = b.textContent.trim().replace(' ↻','');
    if (t==='AGE') age++; else if (t==='STD') std++; else ago++;
  });
  document.getElementById('s-age').textContent = age;
  document.getElementById('s-ago').textContent = ago;
  document.getElementById('s-std').textContent = std;
}

// ─── PASTE HANDLER ────────────────────────────────────────────────────────────
document.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const tr = document.activeElement?.closest('tr');
      if (!tr) return;
      const idx = tr.id.replace('tr-','');
      const key = DATA[idx][0].replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      const r = new FileReader();
      r.onload = ev => setImg(+idx, key, ev.target.result);
      r.readAsDataURL(item.getAsFile());
    }
  }
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.getElementById('tbody').innerHTML = DATA.map((d,i) => buildRow(d,i)).join('');
document.getElementById('s-total').textContent = DATA.length;
updateSummary();
const now = new Date();
document.getElementById('stamp').textContent =
  `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
</script>
